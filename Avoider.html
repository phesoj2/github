<!doctype html><html><head><meta charset="utf-8"><title>Avoider</title><style>body{text-align:center;background:#101010;color:white;font-family:Arial}canvas{border:2px solid white}</style></head><body><h1>Falling Blocks</h1><p>Move with the mouse</p><canvas id=c width=450 height=450></canvas><script>let c=document.getElementById('c'),x=c.getContext('2d'),px=205,bs=[],t=0;c.onmousemove=e=>px=e.offsetX-20;function L(){t++;if(t%15==0)bs.push({x:Math.random()*430,y:-20,v:2+Math.random()*3});bs.forEach(b=>b.y+=b.v);bs=bs.filter(b=>b.y<470);for(let b of bs)if(b.x<px+40&&b.x+20>px&&b.y<440&&b.y+20>420){alert('Hit!');location.reload()}x.clearRect(0,0,450,450);x.fillStyle='lime';x.fillRect(px,420,40,20);x.fillStyle='red';bs.forEach(b=>x.fillRect(b.x,b.y,20,20));x.fillStyle='white';x.fillText('Score '+Math.floor(t/10),10,20);requestAnimationFrame(L)}L()</script></body></html>
