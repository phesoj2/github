<!doctype html><html><head><meta charset="utf-8"><title>Tic Tac Toe</title><style>body{text-align:center;font-family:Arial;background:#181818;color:white}.b{display:grid;grid-template-columns:repeat(3,100px);gap:5px;justify-content:center}.c{width:100px;height:100px;font-size:50px}</style></head><body><h1>Tic Tac Toe</h1><div class=b id=b></div><h2 id=m></h2><button onclick=location.reload()>Restart</button><script>let a=Array(9).fill(''),turn='X',b=document.getElementById('b'),m=document.getElementById('m');a.forEach((_,i)=>{let q=document.createElement('button');q.className='c';q.onclick=()=>{if(a[i]||m.textContent)return;a[i]=turn;q.textContent=turn;let w=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]].some(v=>v.every(j=>a[j]==turn));if(w)m.textContent=turn+' wins!';else if(a.every(Boolean))m.textContent='Draw!';else turn=turn=='X'?'O':'X'};b.appendChild(q)})</script></body></html>
