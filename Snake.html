<!doctype html><html><head><meta charset="utf-8"><title>Snake</title><style>body{font-family:Arial;text-align:center;background:#111;color:white}canvas{background:#000;border:2px solid white}button{padding:10px}</style></head><body><h1>Snake</h1><p>Arrow keys to move • Eat the red squares</p><canvas id="c" width="400" height="400"></canvas><h2 id="s">Score: 0</h2><script>
const c=document.getElementById('c'),x=c.getContext('2d'),g=20;let s=[{x:10,y:10}],d={x:1,y:0},food={x:5,y:5},score=0;
onkeydown=e=>{if(e.key=="ArrowUp"&&d.y==0)d={x:0,y:-1};if(e.key=="ArrowDown"&&d.y==0)d={x:0,y:1};if(e.key=="ArrowLeft"&&d.x==0)d={x:-1,y:0};if(e.key=="ArrowRight"&&d.x==0)d={x:1,y:0}};
function loop(){let h={x:s[0].x+d.x,y:s[0].y+d.y};if(h.x<0||h.y<0||h.x>=20||h.y>=20||s.some(p=>p.x==h.x&&p.y==h.y)){alert("Game over! Score: "+score);location.reload()}s.unshift(h);if(h.x==food.x&&h.y==food.y){score++;document.getElementById("s").textContent="Score: "+score;food={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)}}else s.pop();x.clearRect(0,0,400,400);x.fillStyle="lime";s.forEach(p=>x.fillRect(p.x*g,p.y*g,g-2,g-2));x.fillStyle="red";x.fillRect(food.x*g,food.y*g,g-2,g-2)}setInterval(loop,100)</script></body></html>
