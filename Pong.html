<!doctype html><html><head><meta charset="utf-8"><title>Pong</title><style>body{text-align:center;background:#111;color:white;font-family:Arial}canvas{background:#000}</style></head><body><h1>Pong</h1><p>W/S = left paddle • ↑/↓ = right paddle</p><canvas id=c width=600 height=350></canvas><script>let c=document.getElementById('c'),x=c.getContext('2d'),k={},a=150,b=150,px=300,py=175,vx=4,vy=3,score=0;onkeydown=e=>k[e.key]=1;onkeyup=e=>k[e.key]=0;function L(){if(k.w)a-=5;if(k.s)a+=5;if(k.ArrowUp)b-=5;if(k.ArrowDown)b+=5;a=Math.max(0,Math.min(290,a));b=Math.max(0,Math.min(290,b));px+=vx;py+=vy;if(py<0||py>340)vy*=-1;if(px<20&&py>a&&py<a+60)vx=Math.abs(vx);if(px>570&&py>b&&py<b+60)vx=-Math.abs(vx);if(px<0||px>600){alert('Game over!');location.reload()}x.clearRect(0,0,600,350);x.fillStyle='white';x.fillRect(10,a,10,60);x.fillRect(580,b,10,60);x.fillRect(px,py,10,10);requestAnimationFrame(L)}L()</script></body></html>
