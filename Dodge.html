<!doctype html><html><head><meta charset="utf-8"><title>Dodge</title><style>body{background:#111;color:white;text-align:center;font-family:Arial}canvas{background:#222;border:2px solid white}</style></head><body><h1>Dodge</h1><p>Move with A/D or ←/→</p><canvas id=c width=500 height=400></canvas><h2 id=s>Score: 0</h2><script>let c=document.getElementById('c'),x=c.getContext('2d'),p={x:230,y:350,w:40,h:20},a=[],score=0,keys={};onkeydown=e=>keys[e.key]=1;onkeyup=e=>keys[e.key]=0;function f(){a.push({x:Math.random()*480,y:-20,v:2+Math.random()*4})}setInterval(f,500);function loop(){if(keys.ArrowLeft||keys.a)p.x-=6;if(keys.ArrowRight||keys.d)p.x+=6;p.x=Math.max(0,Math.min(460,p.x));a.forEach(q=>q.y+=q.v);a=a.filter(q=>q.y<420);for(let q of a)if(q.x<p.x+40&&q.x+20>p.x&&q.y<p.y+20&&q.y+20>p.y){alert("You got hit! Score: "+score);location.reload()}score++;document.getElementById('s').textContent='Score: '+Math.floor(score/10);x.clearRect(0,0,500,400);x.fillStyle='cyan';x.fillRect(p.x,p.y,p.w,p.h);x.fillStyle='orange';a.forEach(q=>x.fillRect(q.x,q.y,20,20));requestAnimationFrame(loop)}loop()</script></body></html>
