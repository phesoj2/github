<!doctype html><html><head><meta charset="utf-8"><title>Guess</title><style>body{text-align:center;font-family:Arial;padding:70px;background:#222;color:white}input,button{font-size:25px;padding:10px}</style></head><body><h1>Number Guess</h1><p>Guess a number from 1–100</p><input id=i type=number><button onclick=g()>Guess</button><h2 id=r></h2><script>let n=Math.floor(Math.random()*100)+1,c=0;function g(){let v=+i.value;c++;r.textContent=v==n?'Correct! '+c+' tries':v<n?'Too low!':'Too high!'}</script></body></html>
