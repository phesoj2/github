<!doctype html><html><head><meta charset="utf-8"><title>Reaction</title><style>body{font-family:Arial;text-align:center;background:#111;color:white;padding-top:80px}button{width:80%;height:250px;font-size:40px}</style></head><body><h1>Reaction Test</h1><button id=b>Wait...</button><p id=r></p><script>let b=document.getElementById('b'),r=document.getElementById('r'),t,ready=false;setTimeout(()=>{ready=true;t=performance.now();b.textContent="CLICK!";},Math.random()*3000+1500);b.onclick=()=>{if(!ready)r.textContent="Too early! Refresh to try again.";else r.textContent="Reaction: "+Math.round(performance.now()-t)+" ms";}</script></body></html>
