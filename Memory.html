<!doctype html><html><head><meta charset="utf-8"><title>Memory</title><style>body{text-align:center;font-family:Arial;background:#111;color:white}.g{display:grid;grid-template-columns:repeat(4,80px);gap:8px;justify-content:center}.c{height:80px;font-size:30px}</style></head><body><h1>Memory Match</h1><div class=g id=g></div><script>let v=['🍎','🍎','🚀','🚀','🐶','🐶','⚽','⚽','🎵','🎵','⭐','⭐','🍕','🍕','🎲','🎲'].sort(()=>Math.random()-.5),open=[],done=0,g=document.getElementById('g');v.forEach((z,i)=>{let b=document.createElement('button');b.className='c';b.textContent='?';b.onclick=()=>{if(open.length==2||b.dataset.done)return;b.textContent=z;open.push([b,z]);if(open.length==2){if(open[0][1]==open[1][1]){open.forEach(q=>q[0].dataset.done=1);open=[];done+=2;if(done==16)setTimeout(()=>alert('You won!'),100)}else setTimeout(()=>{open.forEach(q=>q[0].textContent='?');open=[]},600)}};g.appendChild(b)})</script></body></html>
